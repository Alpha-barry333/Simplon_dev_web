<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Exercice 1</title>
    <style>
        /* 1. HTML & CSS : Définition de la variable root */
        :root {
            --couleur-primaire: blue; 
        }

        /* Utilisation de la variable */
        #paragraphe-style {
            background-color: var(--couleur-primaire); 
            color: white;
            padding: 20px;
            font-size: 1.2em;
        }
    </style>
</head>

<body>

    <p id="paragraphe-style">Ce paragraphe change de couleur via CSS Variables.</p>
    <button id="btn-changer-couleur">Changer la couleur</button> 
    <script>
            // 2. JavaScript
        const btn = document.querySelector('#btn-changer-couleur');

        // Partie A (BOM) : Événement click
        btn.addEventListener('click', () => { 
                
            // Affichage des dimensions de la fenêtre
            alert(`Largeur: ${window.innerWidth}, Hauteur: ${window.innerHeight}`); 

            // Partie B (setProperty) : Modification de la variable CSS
            // On cible l'élément racine (html)
                    
            document.documentElement.style.setProperty('--couleur-primaire', 'red');
        });
    </script>
</body>
</html>
</html>
